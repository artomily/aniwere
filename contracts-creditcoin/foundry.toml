[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
# Creditcoin EVM belum tentu mendukung opcode terbaru. Paris paling aman.
# Naikkan hanya kalau sudah diverifikasi di testnet.
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
creditcoin_testnet = "${CREDITCOIN_TESTNET_RPC_URL}"
